name: Wanxiang direct frontend comparison
on:
  workflow_dispatch:
  push:
    branches: [perf/direct-rime-wanxiang-20261016]
permissions:
  contents: read
concurrency:
  group: wanxiang-perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Prepare dependencies and compiler tools for the old baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          git submodule update --init --depth 1 native/prebuilt native/rime-prelude
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the fixed baseline with the same replay harness
        run: |
          baseline_dir="$RUNNER_TEMP/direct-before"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$baseline_dir"
          git -C "$baseline_dir" checkout --detach a713cccde9d47beaffcbcd3344a8f919c6e50a26
          git -C "$baseline_dir" submodule update --init --depth 1 lib/fcitx5/src/main/cpp/fcitx5 plugin/rime/src/main/cpp/fcitx5-rime
          git -C "$baseline_dir" submodule init lib/fcitx5/src/main/cpp/prebuilt plugin/rime/src/main/cpp/rime-prelude
          for item in prebuilt rime-prelude; do
            if [ "$item" = prebuilt ]; then destination="$baseline_dir/lib/fcitx5/src/main/cpp/prebuilt"; else destination="$baseline_dir/plugin/rime/src/main/cpp/rime-prelude"; fi
            if [ -d "$destination" ]; then rmdir "$destination"; fi
            git clone --shared --no-checkout "$GITHUB_WORKSPACE/native/$item" "$destination"
            git -C "$destination" checkout --detach "$(git -C "$GITHUB_WORKSPACE/native/$item" rev-parse HEAD)"
          done
          git -C "$baseline_dir" submodule absorbgitdirs lib/fcitx5/src/main/cpp/prebuilt plugin/rime/src/main/cpp/rime-prelude
          cp app/src/androidTest/java/org/fcitx/fcitx5/android/core/DirectRimeFrontendTest.kt "$baseline_dir/app/src/androidTest/java/org/fcitx/fcitx5/android/core/DirectRimeFrontendTest.kt"
          cd "$baseline_dir"
          ./prepare_personal_build.sh
          ./gradlew -PdirectRimeFrontend=true -PbuildABI=x86_64 --max-workers=2 :app:assembleFxDebug :app:assembleFxDebugAndroidTest
          cp app/build/outputs/apk/fx/debug/*.apk "$RUNNER_TEMP/direct-before.apk"
          cp app/build/outputs/apk/androidTest/fx/debug/*.apk "$RUNNER_TEMP/direct-replay-tests.apk"
      - name: Build the independent frontend and stage the official scheme
        run: |
          ./gradlew -PdirectRimeFrontend=true -PbuildABI=x86_64 --max-workers=2 :app:assembleFxDebug
          cp app/build/outputs/apk/fx/debug/*.apk "$RUNNER_TEMP/direct-after.apk"
          python3 tools/verify-direct-rime-apk.py "$RUNNER_TEMP/direct-after.apk"
          python3 tools/input-perf/prepare-wanxiang.py "$RUNNER_TEMP/wanxiang-perf.zip"
          ./gradlew --stop
          compiler_pids=$(jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}')
          if [ -n "$compiler_pids" ]; then kill $compiler_pids; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: python3 tools/input-perf/compare-apks.py "$RUNNER_TEMP/direct-before.apk" "$RUNNER_TEMP/direct-after.apk" "$RUNNER_TEMP/direct-replay-tests.apk" --wanxiang "$RUNNER_TEMP/wanxiang-perf.zip" --output build/wanxiang-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wanxiang-direct-comparison
          path: build/wanxiang-comparison/
