name: Commit CI

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags-ignore:
      - '[0-9]*'
      - 'v[0-9]*'
    paths:
      - '**/**'
      - '!*.md'
      - '!.gitignore'
      - '!docs/**'

permissions:
  contents: write

jobs:
  build_commit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
        abi:
          - arm64-v8a
    env:
      BUILD_ABI: ${{ matrix.abi }}
      SIGN_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
      SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGN_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/fcitx5-android/fcitx5-android.git || true
          git fetch upstream --tags

      - name: Remove non-semver local tags to avoid confusion
        shell: bash
        run: |
          # keep tags like 0.1.2 or v0.1.2 but delete others (nightly/latest/short-sha)
          git for-each-ref --format='%(refname:strip=2)' refs/tags | while read tag; do
              # allow v1.2 or v1.2.3.4 etc: one or more dot-separated numeric segments
              # use POSIX-compatible groups for bash (no (?: ) non-capturing groups)
              if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)+(-.*)?$ ]]; then
              git tag -d "$tag" || true
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: |
          sdkmanager --install "cmake;3.22.1"

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Prepare personal build sources
        run: |
          ./prepare_personal_build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleFxRelease 2>&1 | tee build-output.log

      - name: Emit compile errors as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f build-output.log ]; then
            grep -aE '^e: |error: |FAILURE: Build failed|> Task .*FAILED' build-output.log | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:500}"
            done
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}-${{ matrix.abi }}
          path: app/build/outputs/apk/fx/release/*.apk

  nightly_release:
    needs: build_commit
    if: github.ref == 'refs/heads/fx-rime-only'
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/fcitx5-android/fcitx5-android.git || true
          git fetch upstream --tags

      - name: Save previous release tag
        id: prev_tag
        shell: bash
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          sha=''
          if [ -n "$tag" ]; then
            sha=$(git rev-parse "${tag}^{commit}" 2>/dev/null || echo '')
          fi
          echo "value=$sha" >> "$GITHUB_OUTPUT"

      - name: Remove non-semver local tags
        shell: bash
        run: |
          git for-each-ref --format='%(refname:strip=2)' refs/tags | while read tag; do
            if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)+(-.*)?$ ]]; then
              git tag -d "$tag" || true
            fi
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Collect APKs
        run: |
          mkdir -p final-release
          find release-artifacts -name "*.apk" -exec cp {} final-release/ \;
          test -n "$(find final-release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Generate nightly tag
        id: tag
        run: echo "value=nightly-$(git describe --tags --long)-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          last_tag="${{ steps.prev_tag.outputs.value }}"
          {
            # Release 标题/正文统一为「靓企鹅·中州韵（Rime-only）」固定头 + Rime-only
            # 注意事项（与 627 版手工格式一致），nightly 不再需要发完手工改标题。
            echo "## 靓企鹅·中州韵（Rime-only） ${{ steps.tag.outputs.value }}"
            echo ""
            echo "### 注意：此版有且仅有Rime插件（已集成）"
            echo "### 包名变更：org.fcitx.fcitx5.android.fx.rime"
            echo ""
            echo ""
            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$last_tag" ]; then
              range="${last_tag}..HEAD"
            else
              range="-30"
            fi
            git log "$range" --no-merges --pretty=format:'- %s (%h)' | head -n 50 || true
          } > release_notes.md
          cat release_notes.md

      - name: Create Nightly release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.value }}
          name: "靓企鹅·中州韵（Rime-only） ${{ steps.tag.outputs.value }}"
          body_path: release_notes.md
          prerelease: true
          files: final-release/*.apk

