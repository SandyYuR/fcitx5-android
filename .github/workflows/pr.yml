name: PR CI

on:
  pull_request:
    branches:
      - fx-rime-only
    paths:
      - '**/**'
      - '!*.md'
      - '!.gitignore'
      - '!docs/**'

permissions:
  contents: read

env:
  BUILD_ABI: arm64-v8a

jobs:
  unit_test:
    name: JVM unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: ./gradlew :app:testFxDebugUnitTest

  debug_build:
    name: Debug APK build
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare personal build sources
        run: ./prepare_personal_build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew :app:assembleFxDebug

      - name: Reject legacy native dependencies and backend classes
        run: |
          python3 tools/verify-direct-rime-apk.py app/build/outputs/apk/fx/debug/*.apk
          python3 tools/audit-direct-rime-link.py app/build/outputs/apk/fx/debug/*.apk > native-link-audit.json

      - uses: actions/upload-artifact@v7
        with:
          name: direct-rime-pr-native-audit
          path: native-link-audit.json
