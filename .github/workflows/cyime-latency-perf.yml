name: CyIME touch latency experiment
run-name: CyIME touch latency (${{ contains(github.event.head_commit.message, '[native-x86]') && 'native x86_64' || 'ARM64 bridge' }})

on:
  push:
    branches: [perf/cyime-latency-20261120]

permissions:
  contents: read
  actions: read

concurrency:
  group: cyime-latency-${{ github.sha }}
  cancel-in-progress: false

jobs:
  arm64-host-check:
    if: ${{ !contains(github.event.head_commit.message, '[native-x86]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check whether a native ARM64 Android guest can use KVM
        run: |
          uname -m
          if test -c /dev/kvm; then
            ls -l /dev/kvm
          else
            printf '%s\n' 'This ARM64 GitHub-hosted runner does not expose /dev/kvm.'
          fi
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        storage: ${{ contains(github.event.head_commit.message, '[app-prewarm]') && fromJSON('["app-prewarm"]') || contains(github.event.head_commit.message, '[prewarm-model]') && fromJSON('["prewarm"]') || contains(github.event.head_commit.message, '[storage-trace]') && fromJSON('["warm","cold"]') || fromJSON('["default"]') }}
    env:
      BENCH_ABI: ${{ contains(github.event.head_commit.message, '[native-x86]') && 'x86_64' || 'arm64-v8a' }}
      BENCH_SUITE: ${{ contains(github.event.head_commit.message, '[long-sentences]') && '--sentences' || '' }}
      BENCH_SHARED: ${{ contains(github.event.head_commit.message, '[shared-wanxiang]') && '--shared-wanxiang' || '' }}
      BENCH_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[pause-diagnostic]') && '--pause-diagnostic' || '' }}
      BENCH_OVERLAP: ${{ contains(github.event.head_commit.message, '[same-key-overlap]') && 'yes' || 'no' }}
      BENCH_TRACE: ${{ contains(github.event.head_commit.message, '[long-trace]') && '--trace-long' || '' }}
      BENCH_STORAGE: ${{ matrix.storage != 'default' && 'yes' || 'no' }}
      BENCH_STORAGE_PRODUCTS: ${{ matrix.storage != 'default' && '--direct-only' || '' }}
      BENCH_STORAGE_MODE: ${{ matrix.storage == 'cold' && '--cold' || matrix.storage == 'prewarm' && '--prewarm' || matrix.storage == 'app-prewarm' && '--app-prewarm' || '' }}
      BENCH_ASSET_COST: ${{ contains(github.event.head_commit.message, '[prewarm-cost]') && 'yes' || 'no' }}
      BENCH_PATCHED: ${{ contains(github.event.head_commit.message, '[handover-build]') && '--expect-handover' || '' }}
      DIRECT_SHA: ${{ contains(github.event.head_commit.message, '[handover-build]') && github.sha || (contains(github.event.head_commit.message, '[same-key-overlap]') || contains(github.event.head_commit.message, '[long-trace]') || contains(github.event.head_commit.message, '[shared-wanxiang]')) && '899eedbf1b7eb8475f7f2a3e162e6ec014763be5' || '4200b65d9ba9802a4d6e75d00a6619eb2732443e' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/download-artifact@v6
        if: env.BENCH_PATCHED == ''
        with:
          artifact-ids: ${{ env.DIRECT_SHA == '899eedbf1b7eb8475f7f2a3e162e6ec014763be5' && '14690585770' || env.BENCH_ABI == 'x86_64' && '14628710616' || '14627779188' }}
          run-id: ${{ env.DIRECT_SHA == '899eedbf1b7eb8475f7f2a3e162e6ec014763be5' && '44861442850' || '44734472106' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/direct-product
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          artifact-ids: '13853652309'
          run-id: '43018095886'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/study-inputs
          merge-multiple: true
      - uses: actions/cache/restore@v5
        id: cyime-cache
        if: env.BENCH_ABI == 'x86_64'
        with:
          path: ${{ runner.temp }}/cyime-native
          key: cyime-3341da598dfbf99d624139d792624093a41a9851-x86_64-${{ hashFiles('tools/cyime-perf/build-x86.sh') }}
      - uses: actions/checkout@v7
        if: env.BENCH_ABI == 'x86_64' && steps.cyime-cache.outputs.cache-hit != 'true'
        with:
          repository: Cyletix/CyIME
          ref: 3341da598dfbf99d624139d792624093a41a9851
          submodules: recursive
          persist-credentials: false
          path: cyime-source
      - uses: gradle/actions/setup-gradle@v6
        if: env.BENCH_PATCHED != '' || (env.BENCH_ABI == 'x86_64' && steps.cyime-cache.outputs.cache-hit != 'true')
      - name: Build the experimental 中州鹅 x86_64 Release
        if: env.BENCH_PATCHED != ''
        env:
          BUILD_ABI: x86_64
        run: |
          python3 tools/prepare-ci-ndk.py
          bash tools/foxy-perf/build-release.sh "$RUNNER_TEMP/direct-product"
      - name: Build the pinned CyIME source as native x86_64 Release
        if: env.BENCH_ABI == 'x86_64' && steps.cyime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/cyime-latency "$RUNNER_TEMP/cyime-native"
          sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'
          bash tools/cyime-perf/build-x86.sh "$GITHUB_WORKSPACE/cyime-source" "$RUNNER_TEMP/cyime-native/cyime.apk" "$GITHUB_WORKSPACE/build/cyime-latency"
          cp build/cyime-latency/cyime-* "$RUNNER_TEMP/cyime-native/"
      - uses: actions/cache/save@v5
        if: env.BENCH_ABI == 'x86_64' && steps.cyime-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/cyime-native
          key: ${{ steps.cyime-cache.outputs.cache-primary-key }}
      - name: Verify exact products and prepare the neutral editor
        run: |
          mkdir -p build/cyime-latency
          direct="$RUNNER_TEMP/direct-product"
          test "$(cat "$direct/source.txt")" = "$DIRECT_SHA"
          printf '%s  %s\n' "$(cut -d ' ' -f 1 "$direct/sha256.txt")" "$direct/direct.apk" | sha256sum -c -
          test "$(sha256sum "$RUNNER_TEMP/study-inputs/fixture.zip" | cut -d ' ' -f 1)" = 333e0a0c8c9beb8a942bd56d3f9c55f1c9123836635a4663744e23f21228404f
          if [ "$BENCH_ABI" = arm64-v8a ]; then
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 240 \
              https://github.com/Cyletix/CyIME/releases/download/1.15.101/CyIME-1.15.101-arm64-v8a.apk \
              --output "$RUNNER_TEMP/cyime.apk"
            printf '%s  %s\n' 955ef612c27f996f1da6af827882b51414facd2562304ba4562aac1b27c65074 "$RUNNER_TEMP/cyime.apk" | sha256sum -c -
          else
            cyime="$RUNNER_TEMP/cyime-native"
            test "$(cat "$cyime/cyime-source.txt")" = 3341da598dfbf99d624139d792624093a41a9851
            printf '%s  %s\n' "$(cut -d ' ' -f 1 "$cyime/cyime-x86-sha256.txt")" "$cyime/cyime.apk" | sha256sum -c -
            cp "$cyime"/cyime-* build/cyime-latency/
            ln -s "$cyime/cyime.apk" "$RUNNER_TEMP/cyime.apk"
          fi
          cp "$direct"/{source.txt,build-metadata.json,rime-sdk.lock.json} "$RUNNER_TEMP/study-inputs/fixture.manifest.json" build/cyime-latency/
          bash tools/cyime-perf/build-host.sh "$RUNNER_TEMP/cyime-host"
          if [ -n "$BENCH_SHARED" ] && ! python3 -c 'import yaml'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          fi
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Build the x86_64 emulator page residency probe
        if: env.BENCH_ASSET_COST == 'yes'
        run: cc -O2 -static -Wall -Wextra -Werror tools/cyime-perf/asset-residency.c -o "$RUNNER_TEMP/asset-residency"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -cores 4 -memory 4096 -camera-back none -camera-front none
          disable-animations: true
          script: |
            python3 tools/cyime-perf/calibrate.py --direct "$RUNNER_TEMP/direct-product/direct.apk" --cyime "$RUNNER_TEMP/cyime.apk" --fixture "$RUNNER_TEMP/study-inputs/fixture.zip" --host "$RUNNER_TEMP/cyime-host/host.apk" --output build/cyime-latency/calibration --abi "$BENCH_ABI" --measure $BENCH_SUITE $BENCH_DIAGNOSTIC $BENCH_SHARED $BENCH_STORAGE_PRODUCTS
            if [ "$BENCH_OVERLAP" = yes ]; then python3 tools/cyime-perf/overlap.py --output build/cyime-latency $BENCH_PATCHED; fi
            if [ "$BENCH_ASSET_COST" = yes ]; then python3 tools/cyime-perf/diagnose-tail.py --output build/cyime-latency --prewarm --asset-probe "$RUNNER_TEMP/asset-residency"; elif [ "$BENCH_STORAGE" = yes ]; then python3 tools/cyime-perf/diagnose-tail.py --output build/cyime-latency $BENCH_STORAGE_MODE; elif [ "$BENCH_OVERLAP" != yes ] || [ -n "$BENCH_TRACE" ]; then python3 tools/cyime-perf/run.py --output build/cyime-latency $BENCH_SUITE $BENCH_DIAGNOSTIC $BENCH_TRACE; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.storage == 'default' && 'cyime-latency-evidence' || format('cyime-latency-{0}-storage', matrix.storage) }}
          path: build/cyime-latency/
          retention-days: 14
