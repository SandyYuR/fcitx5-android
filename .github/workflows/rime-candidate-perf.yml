name: First candidate tap comparison
on:
  workflow_dispatch:
  push:
    branches: ['feat/direct-rime-prototype']
    paths: ['tools/candidate-perf/**', '.github/workflows/rime-candidate-perf.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: rime-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Reuse checksum-verified, identical reference products
        continue-on-error: true # Expired artifacts fall back to rebuilding pinned references.
        uses: actions/download-artifact@v6
        with:
          name: candidate-reference-apks
          run-id: 39102152140
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-apks
      - name: Build untouched Fcitx default and direct reference products
        run: bash tools/candidate-perf/build-products.sh "$RUNNER_TEMP/candidate-apks"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-reference-apks
          path: ${{ runner.temp }}/candidate-apks/
          retention-days: 7
      - name: Prepare neutral editor and exact user fixture
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/screen-perf/build-host.sh "$RUNNER_TEMP/candidate-host" "$GITHUB_WORKSPACE/tools/candidate-perf/host"
          python3 tools/screen-perf/prepare.py "$RUNNER_TEMP/candidate-fixture.zip"
          mkdir -p build/candidate-comparison
          cp "$RUNNER_TEMP/candidate-fixture.manifest.json" "$RUNNER_TEMP/candidate-apks/"*.txt build/candidate-comparison/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: python3 tools/candidate-perf/run.py --apks "$RUNNER_TEMP/candidate-apks" --fixture "$RUNNER_TEMP/candidate-fixture.zip" --host "$RUNNER_TEMP/candidate-host/host.apk" --output build/candidate-comparison --trials 1 --profile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-candidate-tap-results
          path: build/candidate-comparison/
