name: Direct Rime experiment
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'direct-rime/**', 'patches/**', 'tools/input-perf/**', 'tools/test-direct-rime-frontend.sh', 'tools/verify-direct-rime-apk.py', '.github/workflows/direct-rime.yml', 'settings.gradle.kts', 'native/**', 'build-logic/**', '.gitmodules']
permissions:
  contents: read
concurrency:
  group: direct-rime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned submodules from the configured engine fork
        run: |
          git submodule init
          git submodule update --init --depth 1 native/prebuilt native/rime-prelude
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Test native engine safety contract
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -g \
            -I native/prebuilt/librime/arm64-v8a/include \
            direct-rime/src/main/cpp/engine.cpp direct-rime/src/main/cpp/engine_test.cpp -o /tmp/engine-test
          /tmp/engine-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -g \
            direct-rime/src/main/cpp/io-trace.cpp direct-rime/src/main/cpp/io-trace-test.cpp \
            -Wl,--wrap=open,--wrap=__open_2,--wrap=read,--wrap=pread,--wrap=write,--wrap=fsync,--wrap=fdatasync,--wrap=stat \
            -o /tmp/io-trace-test
          /tmp/io-trace-test
      - name: Verify LevelDB open reuse, explicit sync and recovery fallback
        run: python3 tools/input-perf/test-leveldb-open.py "$RUNNER_TEMP/leveldb-open-contract"
      - name: Build isolated APK and run JVM tests
        run: ./gradlew -PdirectRimePrototype=true -PbuildABI=arm64-v8a :direct-rime:assembleDebug :direct-rime:testDebugUnitTest :direct-rime:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: direct-rime-arm64-debug
          path: |
            direct-rime/build/outputs/apk/debug/*.apk
            direct-rime/build/outputs/apk/androidTest/debug/*.apk
            direct-rime/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/leveldb-open-contract/results.json
  android_smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned submodules
        run: |
          git submodule init
          git submodule update --init --depth 1 native/prebuilt native/rime-prelude
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Allow the test runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: ./gradlew -PdirectRimePrototype=true -PbuildABI=x86_64 :direct-rime:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: direct-rime-android-smoke-results
          path: direct-rime/build/reports/androidTests/connected/
  frontend:
    name: Full frontend ARM64 APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Fetch only the pinned Rime dependencies
        run: git submodule update --init --depth 1 native/prebuilt native/rime-prelude
      - name: Verify Fcitx sources are absent
        run: |
          test ! -f lib/fcitx5/src/main/cpp/fcitx5/CMakeLists.txt
          test ! -f plugin/rime/src/main/cpp/fcitx5-rime/CMakeLists.txt
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the original UI on direct librime and run JVM tests
        run: ./gradlew -PbuildABI=arm64-v8a :app:assembleFxDebug :app:testFxDebugUnitTest
      - name: Verify APK dependencies and assets
        run: python3 tools/verify-direct-rime-apk.py app/build/outputs/apk/fx/debug/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: direct-rime-frontend-arm64-debug
          path: |
            app/build/outputs/apk/fx/debug/*.apk
            app/build/reports/tests/testFxDebugUnitTest/
  frontend_android:
    name: Full frontend touch and engine tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Fetch only the pinned Rime dependencies
        run: git submodule update --init --depth 1 native/prebuilt native/rime-prelude
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: bash tools/test-direct-rime-frontend.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: direct-rime-frontend-android-results
          path: app/build/reports/androidTests/
