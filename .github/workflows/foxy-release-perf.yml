name: Direct Rime release and Foxy comparison
on:
  workflow_dispatch:
  push:
    branches: ['feat/direct-rime-prototype']
    paths: ['tools/foxy-perf/**', '.github/workflows/foxy-release-perf.yml']
permissions:
  contents: read
concurrency:
  group: foxy-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Obtain exact user-supplied APK from disposable fixture ref
        run: |
          mkdir -p build/foxy-comparison
          git fetch origin 254e0117863a60da0e06c39736212fbed00f6497
          git show 254e0117863a60da0e06c39736212fbed00f6497:foxy.apk > "$RUNNER_TEMP/foxy.apk"
          echo 'c81783716626c76469a20f1884abfeed63f05349a55ca052ee44079a01b7b80c  '"$RUNNER_TEMP/foxy.apk" | sha256sum -c -
      - name: Prepare neutral editor
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/screen-perf/build-host.sh "$RUNNER_TEMP/foxy-host" "$GITHUB_WORKSPACE/tools/candidate-perf/host"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tools/foxy-perf/probe.py --foxy "$RUNNER_TEMP/foxy.apk" --host "$RUNNER_TEMP/foxy-host/host.apk" --output build/foxy-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foxy-release-comparison-results
          path: build/foxy-comparison/
