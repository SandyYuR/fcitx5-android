name: Direct Rime release and Foxy comparison
on:
  workflow_dispatch:
  push:
    branches: ['feat/direct-rime-prototype']
    paths: ['tools/foxy-perf/**', '.github/workflows/foxy-release-perf.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: foxy-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Reuse final verified Release (no product changes in this harness run)
        uses: actions/download-artifact@v6
        with:
          name: direct-rime-optimized-arm64-release
          run-id: 39134935586
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-product
      - name: Verify artifact source and unchanged product
        run: |
          test "$(cat "$RUNNER_TEMP/release-product/source.txt")" = 12ab22cd82297638bee75ef30b31b3decb21decb
          git diff --exit-code 12ab22cd82297638bee75ef30b31b3decb21decb HEAD -- app direct-rime build-logic native gradle patches settings.gradle.kts build.gradle.kts .gitmodules
          echo 'fbd3aaa62b7bdfa054ddf726b35fab9b939bc1162d583644d3c5282319b564ec  '"$RUNNER_TEMP/release-product/direct.apk" | sha256sum -c -
      - name: Obtain exact user-supplied APK from disposable fixture ref
        run: |
          mkdir -p build/foxy-comparison
          git fetch origin 254e0117863a60da0e06c39736212fbed00f6497
          git show 254e0117863a60da0e06c39736212fbed00f6497:foxy.apk > "$RUNNER_TEMP/foxy.apk"
          echo 'c81783716626c76469a20f1884abfeed63f05349a55ca052ee44079a01b7b80c  '"$RUNNER_TEMP/foxy.apk" | sha256sum -c -
      - name: Prepare neutral editor
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 tools/foxy-perf/build-send-host.py "$RUNNER_TEMP/foxy-host"
          python3 tools/screen-perf/prepare.py "$RUNNER_TEMP/foxy-fixture.zip"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            python3 tools/foxy-perf/pilot.py --foxy "$RUNNER_TEMP/foxy.apk" --direct "$RUNNER_TEMP/release-product/direct.apk" --host "$RUNNER_TEMP/foxy-host/host.apk" --fixture "$RUNNER_TEMP/foxy-fixture.zip" --output build/foxy-comparison/calibration
            python3 tools/foxy-perf/run.py --points tools/foxy-perf/points.json --output build/foxy-comparison/timed
            python3 tools/foxy-perf/send_race.py --points tools/foxy-perf/points.json --output build/foxy-comparison/send-race
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foxy-release-comparison-results
          path: build/foxy-comparison/
