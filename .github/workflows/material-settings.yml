name: Material settings UI

on:
  workflow_dispatch:
  push:
    branches: [fx-rime-only, 'ui/**']
    paths:
      - 'app/src/main/java/**/ui/**'
      - 'app/src/main/java/**/input/dialog/**'
      - 'app/src/main/java/**/clipboardsync/ui/**'
      - 'app/src/main/java/**/utils/**'
      - 'app/src/main/java/**/input/FcitxInputMethodService.kt'
      - 'app/src/main/res/**'
      - 'app/src/androidTest/**'
      - 'tools/test-material-settings.sh'
      - '.github/workflows/material-settings.yml'

permissions:
  contents: read

concurrency:
  group: material-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
      - name: Prepare pinned native sources
        run: |
          # Fcitx needs its translation patch; direct builds use native/prebuilt.
          if [[ -f prepare_personal_build.sh ]]; then
            ./prepare_personal_build.sh
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: bash tools/test-material-settings.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: material-settings-ui-results
          path: app/build/reports/androidTests/
