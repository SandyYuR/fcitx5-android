// External diagnostic overlay. Keep namespace/JNI class names and signing unchanged.
// gradlew -I tools/input-perf/pr32-bench-application-id.init.gradle -PbuildABI=x86_64 :app:assembleFxDebug :app:assembleFxDebugAndroidTest
def benchBaseId = 'org.fcitx.fcitx5.android.pr32bench'
def benchDebugId = benchBaseId + '.debug'

gradle.beforeProject { project ->
    if (project.path != ':app') return
    project.pluginManager.withPlugin('com.android.application') {
        def components = project.extensions.getByName('androidComponents')
        components.finalizeDsl { android ->
            if (android.namespace != 'org.fcitx.fcitx5.android' ||
                    android.defaultConfig.applicationId != 'org.fcitx.fcitx5.android.fx.rime' ||
                    android.buildTypes.getByName('debug').applicationIdSuffix != '.debug') {
                throw new GradleException('Unexpected original package identity; inspect before building.')
            }
            android.productFlavors.each { flavor ->
                if (flavor.applicationId || flavor.applicationIdSuffix) {
                    throw new GradleException('A flavor overrides package identity; inspect before building.')
                }
            }
            android.defaultConfig.applicationId = benchBaseId
            android.defaultConfig.testApplicationId = benchDebugId + '.test'
            android.defaultConfig.manifestPlaceholders['appLabel'] = 'PR32 performance bench'
        }
        components.beforeVariants(components.selector().all()) { variant ->
            if (variant.buildType != 'debug') variant.enable = false
        }
        components.onVariants(components.selector().withBuildType('debug')) { variant ->
            if (variant.applicationId.get() != benchDebugId) {
                throw new GradleException('Unexpected final benchmark applicationId.')
            }
            project.logger.lifecycle('PR32 isolated diagnostic package: ' + variant.applicationId.get())
        }
    }
}
