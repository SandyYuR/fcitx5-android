# Rime default settings
# encoding: utf-8

config_version: '0.40'

# 不预置任何输入方案：首次安装后引擎可正常运行，但没有可用方案，
# 用户需自行把方案文件放入 Rime 用户数据目录，并在 default.custom.yaml
# 中 patch schema_list 后触发部署。
#
# 注意：本文件同时是共享数据目录的定位锚点（fcitx5-rime 的 RimeEngine
# 通过 locate "rime-data/default.yaml" 取得 sharedDataDir），
# 即使 schema_list 为空也绝不能删除本文件。
#
# 用空列表而非删除该键：键缺失会让 WorkspaceUpdate 记录
# "schema list not defined." 并判定部署失败。空列表部署成功且无方案。
schema_list: []

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
