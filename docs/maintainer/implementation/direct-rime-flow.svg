<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 450" role="img" aria-labelledby="title desc">
<title id="title">Rime 直连输入与事件链路</title>
<desc id="desc">真实输入经过服务队列和单一 owner 调用 librime，返回快照后由独立事件队列交付编辑器与候选界面。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#52647b"/></marker></defs>
<rect width="812" height="450" rx="14" fill="#f6f8fb"/>
<g fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"><path d="M252 57H282"/><path d="M522 57H552"/><path d="M674 98V162"/><path d="M556 207H526"/><path d="M286 207H256"/><path d="M134 248V332"/><path d="M158 248V290H404V332"/></g>
<g><rect x="16" y="16" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="134" y="49" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">Android 前端</text><text x="134" y="75" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">真实触摸 / 硬键</text></g>
<g><rect x="286" y="16" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="404" y="49" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">服务任务队列</text><text x="404" y="75" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">ticket / generation</text></g>
<g><rect x="556" y="16" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="674" y="49" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">DirectRimeBackend</text><text x="674" y="75" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">rime-main 单一 owner</text></g>
<g><rect x="556" y="166" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="674" y="199" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">JNI → Engine → librime</text><text x="674" y="225" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">会话 / 方案 / 词典 / 模型</text></g>
<g><rect x="286" y="166" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="404" y="199" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">Snapshot 与事件发布</text><text x="404" y="225" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">commit / 展示 / 选择目标</text></g>
<g><rect x="16" y="166" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="134" y="199" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">InputEventQueue</text><text x="134" y="225" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">独立协程有序排空</text></g>
<g><rect x="16" y="336" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="134" y="369" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">原应用编辑器</text><text x="134" y="395" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">主线程核对连接 → IC</text></g>
<g><rect x="286" y="336" width="236" height="82" rx="10" fill="#fff" stroke="#9aafc6"/><text x="404" y="369" text-anchor="middle" fill="#18334f" font-family="sans-serif" font-size="17">候选及输入界面</text><text x="404" y="395" text-anchor="middle" fill="#46596d" font-family="sans-serif" font-size="14">显示目标 / 点击校验</text></g>
<text x="556" y="365" fill="#46596d" font-family="sans-serif" font-size="14">展示可合并，提交保序。</text><text x="556" y="391" fill="#46596d" font-family="sans-serif" font-size="14">旧编辑器与旧候选目标失效。</text></svg>
